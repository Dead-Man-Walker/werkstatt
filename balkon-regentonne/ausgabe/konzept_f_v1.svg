<svg xmlns="http://www.w3.org/2000/svg" width="790" height="475" viewBox="0 0 790 475" font-family="DejaVu Sans, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087eaf"/></marker></defs><rect x="0" y="0" width="790" height="475" rx="15" fill="#ffffff" stroke="#d4e0e3" stroke-width="3"/><rect x="22" y="20" width="42" height="40" rx="8" fill="#18343b" stroke="none" stroke-width="3"/><text x="34" y="49" font-size="25" fill="#fff" font-weight="700">F</text><text x="79" y="45" font-size="25" fill="#18343b" font-weight="700">Abfluss bei allen Varianten</text><text x="25" y="78" font-size="18" fill="#587079" font-weight="400">Überlauf, Wasserentnahme und Winterablass getrennt</text><rect x="90" y="115" width="140" height="240" rx="9" fill="#fff" stroke="#18343b" stroke-width="3"/><rect x="93" y="175" width="134" height="177" rx="0" fill="#ccebf7" stroke="none" stroke-width="3"/><path d="M93,175 L227,175" fill="none" stroke="#087eaf" stroke-width="2"/><path d="M230,327 L258,327" fill="none" stroke="#127a63" stroke-width="4"/><path d="M90,363 L230,363" fill="none" stroke="#587079" stroke-width="2"/><path d="M230,150 H600 V320" fill="none" stroke="#c06622" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="285" y="137" font-size="18" fill="#c06622" font-weight="700">Überlauf: dauerhaftes Gefälle</text><text x="285" y="176" font-size="17" fill="#18343b" font-weight="400">unterhalb der Überlaufhöhe anschließen</text><rect x="575" y="325" width="150" height="30" rx="5" fill="#eef3f3" stroke="#587079" stroke-width="3"/><text x="580" y="380" font-size="17" fill="#587079" font-weight="400">gesicherter Ablauf</text><path d="M90,340 H58 V375 H545 V350" fill="none" stroke="#127a63" stroke-width="5" stroke-linejoin="round"/><text x="270" y="315" font-size="18" fill="#127a63" font-weight="400">tiefer Ablass + Absperrhahn</text><text x="270" y="340" font-size="17" fill="#127a63" font-weight="400">Schlauch nur zum Entleeren öffnen</text><text x="270" y="220" font-size="17" fill="#18343b" font-weight="400">Alternativ: Rückführung ins Fallrohr.</text><text x="270" y="245" font-size="17" fill="#18343b" font-weight="400">Anschluss und Rückstau gesondert prüfen.</text><text x="270" y="270" font-size="17" fill="#c06622" font-weight="400">Kein Ablauf über die Balkonkante.</text><text x="25" y="429" font-size="18" fill="#18343b" font-weight="400">Notüberlauf ohne Absperrung; Leistung am Zulauf auslegen.</text><text x="25" y="454" font-size="18" fill="#18343b" font-weight="400">Kein Anschlussmaß vor Bestandsaufnahme festlegen.</text></svg>