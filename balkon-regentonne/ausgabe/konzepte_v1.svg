="#18343b" font-weight="400">Anschluss und Rückstau gesondert prüfen.</text><text x="270" y="270" font-size="17" fill="#c06622" font-weight="400">Kein Ablauf über die Balkonkante.</text><text x="25" y="429" font-size="18" fill="#18343b" font-weight="400">Notüberlauf ohne Absperrung; Leistung am Zulauf auslegen.</text><text x="25" y="454" font-size="18" fill="#18343b" font-weight="400">Kein Anschlussmaß vor Bestandsaufnahme festlegen.</text></g><text x="40" y="1618" font-size="17" fill="#587079" font-weight="400">hS: wirksamer Sammlerpegel · hmax: maximaler Tankpegel · gestrichelt orange: Notweg</text><text x="40" y="1648" font-size="20" fill="#18343b" font-weight="400">Blau: Zulauf/Wasserpegel    Orange: Überlauf/Notweg    Grün: Ventil, Anpassung oder Entleerung</text><text x="40" y="1678" font-size="21" fill="#c06622" font-weight="700">Vor Auswahl: Balkonlast, Stellfläche, Fallrohr, Sammleridentität und sicheren Ablauf klären.</text></svg>