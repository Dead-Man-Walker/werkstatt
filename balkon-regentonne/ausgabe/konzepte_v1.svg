af" stroke-width="4" marker-end="url(#arrow)"/><path d="M169,213 L169,355" fill="none" stroke="#587079" stroke-width="4"/><text x="38" y="131" font-size="17" fill="#587079" font-weight="400">Fallrohr</text><text x="85" y="397" font-size="17" fill="#587079" font-weight="400">Restregen weiter im Fallrohr</text><rect x="380" y="140" width="145" height="215" rx="9" fill="#fff" stroke="#18343b" stroke-width="3"/><rect x="383" y="210" width="139" height="142" rx="0" fill="#ccebf7" stroke="none" stroke-width="3"/><path d="M383,210 L522,210" fill="none" stroke="#087eaf" stroke-width="2"/><path d="M525,327 L553,327" fill="none" stroke="#127a63" stroke-width="4"/><text x="560" y="334" font-size="17" fill="#127a63" font-weight="400">Hahn</text><path d="M380,363 L525,363" fill="none" stroke="#587079" stroke-width="2"/><rect x="230" y="260" width="100" height="90" rx="6" fill="#fff" stroke="#18343b" stroke-width="3"/><rect x="234" y="305" width="92" height="40" rx="0" fill="#ccebf7" stroke="none" stroke-width="3"/><path d="M198,185 H250 V260" fill="none" stroke="#087eaf" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="280" cy="325" r="14" fill="#127a63"/><path d="M293,325 H352 V120 H405 V155" fill="none" stroke="#087eaf" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="212" y="376" font-size="17" fill="#127a63" font-weight="400">Pumpe + Pegelsteuerung</text><path d="M230,285 H210 V355" fill="none" stroke="#c06622" stroke-width="5" stroke-linejoin="round" stroke-dasharray="8 6"/><path d="M525,175 H690 V355" fill="none" stroke="#c06622" stroke-width="5" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="555" y="278" font-size="17" fill="#c06622" font-weight="400">Notüberlauf</text><text x="25" y="429" font-size="18" fill="#18343b" font-weight="400">Zwei sichere Überläufe; Tank-voll und Trockenlauf regeln.</text><text x="25" y="454" font-size="18" fill="#18343b" font-weight="400">Strom, zusätzlicher Platz und Wartung e